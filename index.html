<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شات المجموعة الجماعي</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      font-family: 'Cairo', sans-serif;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1f2937;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }

    .chat-bg {
      background-color: #0f172a;
      background-image: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 20px 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-message {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-2 md:p-4">

  <!-- ==================== شاشة تسجيل الدخول ==================== -->
  <div id="loginSection" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl transition-all duration-300">
    
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-indigo-600/20 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
        <i class="fa-solid fa-comments text-4xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white mb-2">أهلاً بك في الدردشة الجماعية</h1>
      <p class="text-slate-400 text-sm">الرجاء إدخال البيانات للدخول إلى الغرفة</p>
    </div>

    <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
      <!-- اسم المستخدم -->
      <div>
        <label for="usernameInput" class="block text-sm font-semibold text-slate-300 mb-2">أكتب اسم المستخدم</label>
        <div class="relative">
          <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-500">
            <i class="fa-solid fa-user"></i>
          </span>
          <input 
            type="text" 
            id="usernameInput" 
            placeholder="أكتب اسم المستخدم" 
            required
            class="w-full pr-10 pl-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-slate-200 placeholder-slate-600 text-sm transition"
          >
        </div>
      </div>

      <!-- الباسورد -->
      <div>
        <label for="passwordInput" class="block text-sm font-semibold text-slate-300 mb-2">أكتب الباسورد</label>
        <div class="relative">
          <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-500">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input 
            type="password" 
            id="passwordInput" 
            placeholder="أكتب الباسورد" 
            required
            class="w-full pr-10 pl-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-slate-200 placeholder-slate-600 text-sm transition"
          >
        </div>
      </div>

      <!-- رسالة الخطأ -->
      <div id="loginError" class="hidden text-rose-500 text-xs text-center bg-rose-500/10 border border-rose-500/20 py-2.5 rounded-lg font-semibold">
        <i class="fa-solid fa-triangle-exclamation ml-1"></i> كلمة المرور غير صحيحة! الباسورد هو 202
      </div>

      <!-- زر الدخول -->
      <button 
        type="submit" 
        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/20 hover:shadow-indigo-500/30 transition duration-200 active:scale-[0.98] flex items-center justify-center gap-2"
      >
        <span>دخول إلى الشات</span>
        <i class="fa-solid fa-arrow-left"></i>
      </button>
    </form>
  </div>


  <!-- ==================== واجهة الشات الجماعي ==================== -->
  <div id="chatSection" class="hidden w-full max-w-4xl h-[92vh] bg-slate-900 border border-slate-800 rounded-3xl flex flex-col shadow-2xl overflow-hidden">
    
    <!-- هيدر الشات -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between z-10">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 rounded-full flex items-center justify-center font-bold">
          <i class="fa-solid fa-users text-lg"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-white">الغرفة العامة</h2>
          <p class="text-xs text-emerald-400 flex items-center gap-1.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            متصل الآن
          </p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="hidden sm:flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
          <i class="fa-solid fa-user-circle text-indigo-400"></i>
          <span id="currentUserDisplay" class="text-xs text-slate-300 font-bold"></span>
        </div>

        <button 
          onclick="logout()" 
          title="تسجيل الخروج"
          class="p-2.5 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl border border-transparent hover:border-rose-500/20 transition"
        >
          <i class="fa-solid fa-right-from-bracket text-lg"></i>
        </button>
      </div>
    </header>

    <!-- منطقة الرسائل -->
    <main id="messagesContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 chat-bg">
      <div class="text-center my-4">
        <span class="text-[11px] text-slate-400 bg-slate-900/80 border border-slate-800 px-3 py-1 rounded-full">
          مرحباً بك في المحادثة! جميع الرسائل تظهر فوراً للجميع.
        </span>
      </div>
    </main>

    <!-- منطقة كتابة الرسالة -->
    <footer class="p-3 sm:p-4 bg-slate-900 border-t border-slate-800">
      <form id="messageForm" onsubmit="sendMessage(event)" class="flex items-center gap-2">
        <input 
          type="text" 
          id="messageInput" 
          placeholder="أكتب رسالتك هنا..." 
          autocomplete="off"
          class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-slate-600 transition"
        >
        <button 
          type="submit" 
          class="px-5 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold shadow-md shadow-indigo-600/20 transition active:scale-95 flex items-center gap-2"
        >
          <span class="hidden sm:inline text-sm">إرسال</span>
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </footer>

  </div>


  <!-- ==================== المكونات البرمجية JavaScript ==================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://group-chat-202-default-rtdb.firebaseio.com/"
    };

    let db = null;
    let messagesRef = null;

    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      messagesRef = ref(db, "group_messages");
    } catch (e) {
      console.warn("تنبيه: وضع الشبكة المحلية المؤقتة.");
    }

    let currentUser = "";
    const REQUIRED_PASSWORD = "202";

    window.handleLogin = function(event) {
      event.preventDefault();
      
      const username = document.getElementById("usernameInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();
      const errorDiv = document.getElementById("loginError");

      if (!username) return;

      if (password === REQUIRED_PASSWORD) {
        currentUser = username;
        errorDiv.classList.add("hidden");
        
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("chatSection").classList.remove("hidden");
        document.getElementById("currentUserDisplay").textContent = currentUser;

        initChatListener();
        scrollToBottom();
      } else {
        errorDiv.classList.remove("hidden");
      }
    };

    window.logout = function() {
      currentUser = "";
      document.getElementById("chatSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("passwordInput").value = "";
      document.getElementById("loginError").classList.add("hidden");
    };

    window.sendMessage = function(event) {
      event.preventDefault();
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text || !currentUser) return;

      const msgData = {
        sender: currentUser,
        text: text,
        timestamp: Date.now()
      };

      if (messagesRef) {
        push(messagesRef, msgData);
      } else {
        renderMessage(msgData);
        if (window.chatChannel) {
          window.chatChannel.postMessage(msgData);
        }
      }

      input.value = "";
      input.focus();
    };

    function initChatListener() {
      const messagesContainer = document.getElementById("messagesContainer");
      
      if (messagesRef && !window.listenerAdded) {
        window.listenerAdded = true;
        onChildAdded(messagesRef, (snapshot) => {
          const data = snapshot.val();
          if (data) renderMessage(data);
        });
      }

      if (!window.chatChannel) {
        window.chatChannel = new BroadcastChannel('local_chat_channel');
        window.chatChannel.onmessage = (e) => {
          if (!messagesRef) renderMessage(e.data);
        };
      }
    }

    function renderMessage(data) {
      const container = document.getElementById("messagesContainer");
      const isMe = data.sender === currentUser;

      const timeStr = new Date(data.timestamp || Date.now()).toLocaleTimeString('ar-EG', {
        hour: '2-digit',
        minute: '2-digit'
      });

      const msgWrapper = document.createElement("div");
      msgWrapper.className = `flex flex-col ${isMe ? 'items-start' : 'items-end'} animate-message my-2`;

      msgWrapper.innerHTML = `
        <div class="flex items-center gap-1.5 mb-1 text-[11px] font-semibold text-slate-400 px-1">
          <span>${data.sender}</span>
          <span>•</span>
          <span class="text-[10px] text-slate-500">${timeStr}</span>
        </div>
        <div class="max-w-[85%] sm:max-w-[70%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed ${
          isMe 
            ? 'bg-indigo-600 text-white rounded-tr-none shadow-md shadow-indigo-600/10' 
            : 'bg-slate-800 text-slate-100 border border-slate-700/60 rounded-tl-none'
        }">
          <p class="break-words font-normal">${escapeHTML(data.text)}</p>
        </div>
      `;

      container.appendChild(msgWrapper);
      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById("messagesContainer");
      container.scrollTop = container.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
